name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Unit tests and app build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select the newest Xcode 26
        run: |
          latest="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$latest" ]; then
            echo "::error::This runner has no Xcode 26, which the app needs (iOS 26 SDK)."
            exit 1
          fi
          sudo xcode-select -s "$latest/Contents/Developer"
      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list runtimes
      - name: Check for banned patterns
        run: ./scripts/check-banned-patterns.sh
      - name: Check the test count ratchet
        run: ./scripts/check-test-count.sh
      - name: Verify the checked-in project matches the sources
        run: ./scripts/verify-xcode-project.sh
      - name: Build the app, widget and share extension, and run the unit tests
        run: ./scripts/test.sh
      - name: Check the coverage ratchet
        run: ./scripts/check-coverage.sh --from-results
      - name: Keep the test results when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: .build/TestResults.xcresult
          retention-days: 7
