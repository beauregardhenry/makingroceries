name: Test count ratchet

# Raises test-count-baseline.txt on main after the test count climbs, instead of relying on each PR
# to bump the file itself. Keeps the file out of feature branches entirely and lets exactly one
# place, post-merge on main, own writing to it. coverage-ratchet.yml does the same for
# coverage-baseline.txt.
#
# Pushing to main works out of the box with the workflow's own token while the repository has no
# branch ruleset. If you later add a ruleset that requires pull requests, give the job a
# RATCHET_DEPLOY_KEY secret: the private half of a write-enabled deploy key, which a ruleset can let
# bypass the pull request rule. With the secret set, the checkout below pushes over SSH with it.

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: test-count-ratchet-main
  cancel-in-progress: false

jobs:
  ratchet:
    name: Ratchet the test count baseline
    runs-on: macos-15
    timeout-minutes: 5
    if: "!contains(github.event.head_commit.message, '[skip ratchet]')"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          # Unset, checkout keeps the default token; set, it pushes over SSH with the deploy key.
          ssh-key: ${{ secrets.RATCHET_DEPLOY_KEY }}
      - name: Measure the test count and raise the baseline if it climbed
        run: ./scripts/check-test-count.sh --update-if-higher
      - name: Commit and push the baseline if it changed
        run: |
          if git diff --quiet -- test-count-baseline.txt; then
            echo "No test count increase to record."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test-count-baseline.txt
          git commit -m "chore: ratchet test count baseline [skip ratchet] [skip ci]" -m "$(git diff --cached -- test-count-baseline.txt)"
          # coverage-ratchet.yml runs on the same push and may land first, as may another merge. The
          # two baseline files never overlap, so rebasing this one-line commit onto the new main and
          # retrying is safe; a genuine conflict still fails the job loudly.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved since checkout (attempt ${attempt}); rebasing onto it and retrying."
            git pull --rebase origin main
          done
          echo "Could not push the raised baseline after 3 attempts." >&2
          exit 1
