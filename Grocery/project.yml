name: Grocery
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Grocery:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: GroceryWidget
    entitlements:
      path: Sources/Grocery.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.grocery]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.grocery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Makin' Groceries"
        INFOPLIST_KEY_NSCameraUsageDescription: "Makin' Groceries uses the camera to scan product barcodes."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Makin' Groceries uses your location to remember where a store is, so it can remind you of your list when you arrive."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Makin' Groceries uses your location to remind you of your list when you arrive at a store you've set up, even when the app is closed. Your location stays on this device."
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GroceryWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/GroceryWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.grocery]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Grocery List
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.grocery.widget
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
