name: Grocery
options:
  bundleIdPrefix: com.beauregardhenry
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8K5724Q6WR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Grocery:
    type: application
    platform: iOS
    sources: [Sources, Shared, WatchShared]
    dependencies:
      - target: GroceryWidget
      - target: ShareExtension
      # Apple Watch app. Uncomment to embed it in the iPhone app. This needs the watchOS platform
      # installed in Xcode (Settings > Components), or builds will stop with "watchOS must be installed".
      # - target: GroceryWatch
    info:
      path: Sources/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.beauregardhenry.makingroceries.list
            UTTypeDescription: Makin' Groceries List
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [makinglist]
              public.mime-type: application/x-makinglist
        CFBundleDocumentTypes:
          - CFBundleTypeName: Makin' Groceries List
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.beauregardhenry.makingroceries.list]
    entitlements:
      path: Sources/Grocery.entitlements
      properties:
        com.apple.security.application-groups: [group.com.beauregardhenry.makingroceries]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Makin' Groceries"
        INFOPLIST_KEY_NSCameraUsageDescription: "Makin' Groceries uses the camera to scan product barcodes."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Makin' Groceries uses your location to remember where a store is, so it can remind you of your list when you arrive."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Makin' Groceries uses your location to remind you of your list when you arrive at a store you've set up, even when the app is closed. Your location stays on this device."
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Lime AppIcon-Berry AppIcon-Midnight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Makin' Groceries listens when you tap the microphone to add items by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Makin' Groceries turns your voice into list items. It uses on-device recognition when your iPhone supports it."
  GroceryWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/GroceryWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.beauregardhenry.makingroceries]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Grocery List
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries.widget
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
  GroceryWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources: [Watch, WatchShared]
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: "Makin' Groceries"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.beauregardhenry.makingroceries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries.watchkitapp
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared
        excludes: [GroceryIntents.swift]
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.beauregardhenry.makingroceries]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "Makin' Groceries"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries.share
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
schemes:
  Grocery:
    build:
      targets:
        Grocery: all
        GroceryWidget: all
        ShareExtension: all
    run:
      config: Debug
    archive:
      config: Release
  GroceryWatch:
    build:
      targets:
        GroceryWatch: all
    run:
      config: Debug
