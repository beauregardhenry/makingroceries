name: Grocery
options:
  bundleIdPrefix: com.beauregardhenry
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: 8K5724Q6WR
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Grocery:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: GroceryWidget
      - target: ShareExtension
      # Apple Watch app. Uncomment to embed it in the iPhone app. This needs the watchOS platform
      # installed in Xcode (Settings > Components), or builds will stop with "watchOS must be installed".
      # - target: GroceryWatch
    info:
      path: Sources/Info.plist
      properties:
        NSLocalNetworkUsageDescription: Live Sync finds other phones in your household on this network to keep one grocery list.
        NSBonjourServices: [_mkgroceries._tcp, _mkgroceries._udp]
        # iCloud sync hears about changes from other devices through silent pushes.
        UIBackgroundModes: [remote-notification]
        # The app only uses the encryption built into iOS (iCloud, Live Sync, hashing), which is exempt, so
        # App Store Connect doesn't ask the export-compliance question for every TestFlight build.
        ITSAppUsesNonExemptEncryption: false
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.beauregardhenry.makingroceries.list
            UTTypeDescription: Makin' Groceries List
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [makinglist]
              public.mime-type: application/x-makinglist
        # The app imports a copy of a received list and merges it; it never edits the file itself, so
        # App Store Connect's document-based-app check wants this stated as NO.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Makin' Groceries List
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.beauregardhenry.makingroceries.list]
    entitlements:
      path: Sources/Grocery.entitlements
      properties:
        com.apple.security.application-groups: [group.com.beauregardhenry.makingroceries]
        # iCloud sync (CloudKit, private database). Needs a paid Apple Developer membership; to build
        # with a free Apple ID, delete these three keys and the remote-notification background mode.
        com.apple.developer.icloud-container-identifiers: [iCloud.com.beauregardhenry.makingroceries]
        com.apple.developer.icloud-services: [CloudKit]
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # App Store Connect rejects a universal app that doesn't list the orientations it supports (iPad
        # multitasking needs all four). iPhone keeps what it had: portrait and both landscapes.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Makin' Groceries"
        INFOPLIST_KEY_NSCameraUsageDescription: "Makin' Groceries uses the camera to scan product barcodes."
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Makin' Groceries uses your location to remember where a store is, so it can remind you of your list when you arrive."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Makin' Groceries uses your location to remind you of your list when you arrive at a store you've set up, even when the app is closed. Your location stays on this device."
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Lime AppIcon-Berry AppIcon-Midnight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Makin' Groceries listens when you tap the microphone to add items by voice."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Makin' Groceries turns your voice into list items. It uses on-device recognition when your iPhone supports it."
  GroceryWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    entitlements:
      path: Widget/GroceryWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.beauregardhenry.makingroceries]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Grocery List
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries.widget
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
  GroceryWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - Watch
      # Only the list format; the watch has no GroceryStore.
      - Shared/WatchSnapshot.swift
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: "Makin' Groceries"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.beauregardhenry.makingroceries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries.watchkitapp
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  GroceryTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/GroceryTests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries.tests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        # The test bundle runs the shared logic on its own, with no app around it.
        CODE_SIGNING_ALLOWED: NO
  GroceryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/GroceryUITests]
    dependencies:
      - target: Grocery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Grocery
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - path: Shared
        excludes: [GroceryIntents.swift]
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups: [group.com.beauregardhenry.makingroceries]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: "Makin' Groceries"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beauregardhenry.makingroceries.share
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
schemes:
  Grocery:
    build:
      targets:
        Grocery: all
        GroceryWidget: all
        ShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets: [GroceryTests]
      targets:
        - name: GroceryTests
    archive:
      config: Release
  GroceryUITests:
    build:
      targets:
        Grocery: all
        GroceryWidget: all
        ShareExtension: all
        GroceryUITests: [test]
    test:
      config: Debug
      targets:
        - name: GroceryUITests
  GroceryWatch:
    build:
      targets:
        GroceryWatch: all
    run:
      config: Debug
