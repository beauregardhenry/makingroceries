name: Grocery
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
targets:
  Grocery:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.grocery
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Groceries
        INFOPLIST_KEY_NSCameraUsageDescription: "Groceries uses the camera to scan product barcodes."
        SWIFT_VERSION: "5.0"
